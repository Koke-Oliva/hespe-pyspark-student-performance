name: PySpark Notebook CI

on:
  pull_request:
    branches: [main]
    paths:
      - "hespe_pyspark_student_performance.ipynb"
      - "notebooks/professional/**"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/notebook-ci.yml"
  push:
    branches: [main]
    paths:
      - "hespe_pyspark_student_performance.ipynb"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/notebook-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore professional notebook source
        if: github.event_name == 'pull_request'
        run: |
          base64 -d notebooks/professional/hespe_pyspark_student_performance.ipynb.gz.b64 \
            | gunzip > hespe_pyspark_student_performance.ipynb
          python -m json.tool hespe_pyspark_student_performance.ipynb > /dev/null

      - name: Execute notebook end-to-end
        env:
          SPARK_MASTER: "local[*]"
        run: |
          mkdir -p artifacts figures
          jupyter nbconvert \
            --to notebook \
            --execute hespe_pyspark_student_performance.ipynb \
            --output artifacts/hespe_pyspark_student_performance.executed.ipynb \
            --ExecutePreprocessor.timeout=2400

      - name: Promote executed notebook
        if: github.event_name == 'pull_request'
        run: |
          cp artifacts/hespe_pyspark_student_performance.executed.ipynb \
             hespe_pyspark_student_performance.ipynb

      - name: Commit validated notebook and figures to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hespe_pyspark_student_performance.ipynb figures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] chore: refresh validated HESPE notebook and figures"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload executed notebook and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hespe-pyspark-execution
          path: |
            artifacts/hespe_pyspark_student_performance.executed.ipynb
            figures/*.png
          if-no-files-found: warn
