name: PySpark Notebook CI

on:
  pull_request:
    branches: [main]
    paths:
      - "hespe_pyspark_student_performance.ipynb"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/notebook-ci.yml"
  push:
    branches: [main]
    paths:
      - "hespe_pyspark_student_performance.ipynb"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/notebook-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate notebook JSON
        run: python -m json.tool hespe_pyspark_student_performance.ipynb > /dev/null

      - name: Execute notebook end-to-end
        env:
          SPARK_MASTER: "local[*]"
        run: |
          mkdir -p artifacts figures
          jupyter nbconvert \
            --to notebook \
            --execute hespe_pyspark_student_performance.ipynb \
            --output artifacts/hespe_pyspark_student_performance.executed.ipynb \
            --ExecutePreprocessor.timeout=2400

      - name: Upload executed notebook and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hespe-pyspark-execution
          path: |
            artifacts/hespe_pyspark_student_performance.executed.ipynb
            figures/*.png
          if-no-files-found: warn
